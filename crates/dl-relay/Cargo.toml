[package]
name = "dl-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional self-hosted streaming CORS relay for the opendownloader web app"
publish = false

[lib]
name = "dl_relay"
path = "src/lib.rs"

[[bin]]
name = "dl-relay"
path = "src/main.rs"

[dependencies]
dl-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio-util = { workspace = true }
# Strict YouTube-URL validation for the /youtube route — the security boundary before
# yt-dlp is ever spawned. Already in the tree via reqwest; declared here because the code
# uses it directly.
url = "2"
