# dl-relay configuration.
#
# Every field is optional; the values below are the defaults. Copy this to
# dl-relay.toml (beside the binary, or anywhere and pass the path as the first
# argument) and change only what you need.

# Where to listen. Loopback by default — put a TLS reverse proxy in front rather
# than exposing this directly.
bind = "127.0.0.1:8088"

# CORS. "*" is reasonable for a relay only you use; name your app's origin
# explicitly if anyone else can reach the port.
allowed_origins = ["*"]

# Upstream hosts this relay will talk to. An entry covers the host and its
# subdomains. Empty means "any host the compliance policy already permits".
allow_hosts = []

# Off unless you mean it. On, every client of this relay can reach every host
# this relay can reach — including everything on its LAN and any cloud metadata
# endpoint. Only turn it on for a relay bound to loopback on a machine you own.
allow_private_hosts = false

# Ceiling on one relayed response, in bytes. 20 GiB. Enforced from the upstream
# content-length and again while streaming, since a chunked response has no length.
max_bytes = 21474836480

# Simultaneous upstream requests. Anything over this is answered 503.
max_concurrent = 8

# Connect plus response-headers timeout. NOT a whole-body timeout: a large file
# over a slow link is the normal case here.
timeout_seconds = 30

# --- Server-side YouTube extraction (the /youtube route) ---------------------
#
# Off by default. When on, the relay runs `yt-dlp` to extract and mux a YouTube
# video, then streams the merged MP4 back. This is the one route that runs an
# external program, so it is opt-in.
#
# WHERE YOU RUN THIS DECIDES WHETHER IT WORKS. YouTube distrusts datacenter IPs
# hardest. On a residential IP (a laptop, a home server) yt-dlp pulls full videos
# with nothing else set. On a cloud VM you will hit the same ~60-second wall the
# extension did unless you supply cookies AND a residential egress proxy below.
# That is the arms race, not a relay bug.
[youtube]
# enabled = false

# The yt-dlp binary. A bare name is found on PATH; an absolute path pins it.
# ytdlp_path = "yt-dlp"

# A JavaScript runtime for yt-dlp (e.g. "deno"). Current yt-dlp needs one to
# decipher the `n` parameter for some clients and warns that formats may be
# missing without it — set it on a production install. Empty = yt-dlp's default.
# js_runtime = ""

# Netscape-format cookies file. On a datacenter IP this is often what makes
# extraction work; on a residential IP it is usually unnecessary. Empty = none.
# cookies_file = ""

# Egress proxy for yt-dlp ("http://..." or "socks5://..."). A residential proxy
# is the other half of making this work from a cloud host. Empty = direct.
# proxy = ""

# Highest video height the route will serve. The free tier is 1080p; higher
# resolutions are the credit-gated path. Enforced server-side, so the relay is
# never the weak link even if a client asks for more.
# max_height = 1080
